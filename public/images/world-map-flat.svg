<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none">
  <rect width="1000" height="500" fill="#0c1018"/>
  <!-- subtle grid -->
  <g stroke="#1a2233" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="125" x2="1000" y2="125"/>
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="0" y1="375" x2="1000" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>
  <!-- simplified continents  light on dark -->
  <g fill="#d4dce8" opacity="0.92">
    <!-- North America -->
    <path d="M80,95 Q120,70 165,80 L200,110 Q215,140 195,175 L170,210 Q140,230 110,215 L75,185 Q60,150 80,95Z"/>
    <path d="M115,200 Q150,195 175,220 L185,260 Q170,290 140,285 L105,265 Q90,235 115,200Z"/>
    <!-- South America -->
    <path d="M230,280 Q255,260 270,290 L280,340 Q275,390 255,420 L235,400 Q220,350 230,280Z"/>
    <!-- Europe -->
    <path d="M470,95 Q500,80 530,95 L545,120 Q535,145 510,150 L480,140 Q465,120 470,95Z"/>
    <!-- Africa -->
    <path d="M480,165 Q520,155 540,185 L550,250 Q545,320 520,360 L490,350 Q470,280 475,210 Q478,185 480,165Z"/>
    <!-- Asia -->
    <path d="M560,75 Q640,55 720,70 L820,85 Q880,100 920,130 L940,170 Q930,210 890,230 L820,245 Q750,250 700,235 L620,220 Q560,200 540,165 L530,120 Q545,90 560,75Z"/>
    <path d="M700,240 Q760,235 800,255 L820,290 Q800,320 760,325 L710,315 Q680,290 700,240Z"/>
    <!-- Southeast Asia / islands -->
    <path d="M720,270 Q760,265 790,285 L800,310 Q780,335 745,330 L715,310 Q705,290 720,270Z"/>
    <path d="M830,250 Q855,245 870,265 L875,290 Q860,310 835,305 L820,280 Q825,260 830,250Z"/>
    <!-- Australia -->
    <path d="M800,355 Q860,345 910,365 L925,395 Q910,420 870,425 L820,415 Q790,395 800,355Z"/>
  </g>
  <!-- equator accent -->
  <line x1="0" y1="250" x2="1000" y2="250" stroke="#2a3548" stroke-width="1" stroke-dasharray="6 8" opacity="0.5"/>
</svg>
